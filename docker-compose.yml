services:
  broker:
    build:
      context: .
      dockerfile: src/integration-service/Broker/Dockerfile
    environment:
      BROKER_BIND_IP: "0.0.0.0"
      BROKER_BIND_PORT: "6001"
      BROKER_DB_PATH: "/app/data/broker.db"
      BROKER_LOG_PATH: "/app/data/broker.log"
    ports:
      - "6001:6001"
    volumes:
      - broker-data:/app/data

  receiver:
    build:
      context: .
      dockerfile: src/consumers/receivers/Dockerfile
    stdin_open: true
    tty: true
    depends_on:
      - broker
    environment:
    - RECEIVER_EFFECTS_PATH=/data/effects.log
    - RECEIVER_LOG_PATH=/data/receiver.log
    volumes:
    - receiver-data:/data
  sender:
    build:
      context: .
      dockerfile: src/providers/providers/Dockerfile
    stdin_open: true
    tty: true
    depends_on:
      - broker
    environment:
    - SENDER_LOG_PATH=/data/sender.log
    volumes:
    - sender-data:/data

  # Part 2, same components over gRPC
  broker-grpc:
    build:
      context: .
      dockerfile: src/integration-service/BrokerGrpc/Dockerfile
    environment:
      BROKER_BIND_IP: "0.0.0.0"
      BROKER_BIND_PORT: "6002"
      BROKER_DB_PATH: "/app/data/broker-grpc.db"
      BROKER_LOG_PATH: "/app/data/broker-grpc.log"
    ports:
      - "6002:6002"
    volumes:
      - broker-grpc-data:/app/data

  receiver-grpc:
    build:
      context: .
      dockerfile: src/consumers/receiversGrpc/Dockerfile
    stdin_open: true
    tty: true
    depends_on:
      - broker-grpc
    environment:
    - RECEIVER_EFFECTS_PATH=/data/effects-grpc.log
    - RECEIVER_LOG_PATH=/data/receiver-grpc.log
    volumes:
    - receiver-grpc-data:/data
  sender-grpc:
    build:
      context: .
      dockerfile: src/providers/providersGrpc/Dockerfile
    stdin_open: true
    tty: true
    depends_on:
      - broker-grpc
    environment:
    - SENDER_LOG_PATH=/data/sender-grpc.log
    volumes:
    - sender-grpc-data:/data
volumes:
  broker-data:
  receiver-data:
  sender-data:
  broker-grpc-data:
  receiver-grpc-data:
  sender-grpc-data: