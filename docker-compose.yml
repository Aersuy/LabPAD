services:
  broker:
    build:
      context: .
      dockerfile: src/integration-service/Broker/Dockerfile
    environment:
      BROKER_BIND_IP: "0.0.0.0"
      BROKER_BIND_PORT: "6001"
    ports:
      - "6001:6001"

  receiver:
    build:
      context: .
      dockerfile: src/consumers/receivers/Dockerfile
    stdin_open: true
    tty: true
    depends_on:
      - broker
  sender:
    build:
      context: .
      dockerfile: src/order-service/previders/Dockerfile
    stdin_open: true
    tty: true
    depends_on:
      - broker